<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 809 1536" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d090d"/>
      <stop offset=".48" stop-color="#a50f16"/>
      <stop offset="1" stop-color="#6b0509"/>
    </linearGradient>
    <linearGradient id="paperLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d45a4d" stop-opacity=".16"/>
      <stop offset=".42" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#240002" stop-opacity=".28"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1a9"/>
      <stop offset=".22" stop-color="#b77925"/>
      <stop offset=".48" stop-color="#ffe7a0"/>
      <stop offset=".72" stop-color="#9b5d18"/>
      <stop offset="1" stop-color="#f6d77b"/>
    </linearGradient>
    <filter id="paperTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="4" seed="19" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono" result="soft">
        <feFuncA type="table" tableValues="0 .12"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="soft" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <g id="flower">
      <circle cx="0" cy="0" r="8" fill="url(#gold)" opacity=".95"/>
      <g fill="none" stroke="url(#gold)" stroke-width="2">
        <ellipse cx="0" cy="-16" rx="9" ry="17"/>
        <ellipse cx="15" cy="-5" rx="17" ry="9" transform="rotate(35 15 -5)"/>
        <ellipse cx="10" cy="12" rx="16" ry="9" transform="rotate(72 10 12)"/>
        <ellipse cx="-10" cy="12" rx="16" ry="9" transform="rotate(-72 -10 12)"/>
        <ellipse cx="-15" cy="-5" rx="17" ry="9" transform="rotate(-35 -15 -5)"/>
      </g>
      <circle cx="0" cy="0" r="3" fill="#fff0a4"/>
    </g>
    <g id="leaf">
      <path d="M0 0 C10 -17 27 -17 32 -5 C21 8 8 8 0 0Z" fill="url(#gold)" opacity=".92"/>
      <path d="M2 0 C12 -4 21 -8 29 -9" fill="none" stroke="#7a4310" stroke-width="1.2" opacity=".8"/>
    </g>
    <g id="sprig" fill="none" stroke="url(#gold)" stroke-linecap="round">
      <path d="M0 250 C48 390 78 275 138 150 C168 88 205 40 242 10" stroke-width="3"/>
      <path d="M42 350 C12 322 0 288 2 250" stroke-width="2"/>
      <path d="M72 285 C112 268 140 236 158 198" stroke-width="2"/>
      <path d="M104 220 C72 194 66 160 72 130" stroke-width="2"/>
      <path d="M140 165 C178 154 205 126 222 91" stroke-width="2"/>
    </g>
  </defs>

  <rect width="809" height="1536" fill="#4b0205"/>
  <rect x="11" y="0" width="787" height="1536" rx="2" fill="url(#paper)" filter="url(#paperTexture)"/>
  <rect x="11" y="0" width="787" height="1536" fill="url(#paperLight)"/>

  <!-- Fine double foil frame -->
  <g fill="none" stroke="url(#gold)">
    <rect x="17" y="17" width="775" height="1502" stroke-width="1.4"/>
    <rect x="24" y="24" width="761" height="1488" stroke-width=".7" opacity=".9"/>
  </g>

  <!-- Corner ornaments -->
  <g transform="translate(37 37) scale(.8)"><use href="#flower"/></g>
  <g transform="translate(772 37) rotate(90) scale(.8)"><use href="#flower"/></g>
  <g transform="translate(37 1499) rotate(-90) scale(.8)"><use href="#flower"/></g>
  <g transform="translate(772 1499) rotate(180) scale(.8)"><use href="#flower"/></g>

  <!-- Top left botanical arrangement -->
  <g transform="translate(0 20)">
    <use href="#sprig"/>
    <g transform="translate(72 300) rotate(-24) scale(1.05)"><use href="#flower"/></g>
    <g transform="translate(98 226) rotate(-24) scale(.58)"><use href="#leaf"/></g>
    <g transform="translate(66 286) rotate(18) scale(.65)"><use href="#leaf"/></g>
    <g transform="translate(121 202) rotate(-12) scale(.58)"><use href="#leaf"/></g>
    <g transform="translate(160 151) rotate(35) scale(.62)"><use href="#leaf"/></g>
    <g transform="translate(74 350) rotate(-38) scale(.64)"><use href="#leaf"/></g>
    <g transform="translate(44 382) rotate(-35) scale(.58)"><use href="#leaf"/></g>
    <g transform="translate(145 272) rotate(18) scale(.5)"><use href="#leaf"/></g>
    <circle cx="125" cy="320" r="4" fill="url(#gold)"/>
    <circle cx="164" cy="350" r="3" fill="url(#gold)"/>
    <circle cx="190" cy="238" r="4" fill="url(#gold)"/>
  </g>

  <!-- Bottom right botanical arrangement -->
  <g transform="translate(809 1536) rotate(180)">
    <use href="#sprig"/>
    <g transform="translate(72 300) rotate(-24) scale(1.05)"><use href="#flower"/></g>
    <g transform="translate(98 226) rotate(-24) scale(.58)"><use href="#leaf"/></g>
    <g transform="translate(66 286) rotate(18) scale(.65)"><use href="#leaf"/></g>
    <g transform="translate(121 202) rotate(-12) scale(.58)"><use href="#leaf"/></g>
    <g transform="translate(160 151) rotate(35) scale(.62)"><use href="#leaf"/></g>
    <g transform="translate(74 350) rotate(-38) scale(.64)"><use href="#leaf"/></g>
    <g transform="translate(44 382) rotate(-35) scale(.58)"><use href="#leaf"/></g>
    <g transform="translate(145 272) rotate(18) scale(.5)"><use href="#leaf"/></g>
    <circle cx="125" cy="320" r="4" fill="url(#gold)"/>
    <circle cx="164" cy="350" r="3" fill="url(#gold)"/>
    <circle cx="190" cy="238" r="4" fill="url(#gold)"/>
  </g>

  <!-- Flap geometry is rendered by the interactive HTML/CSS flap layers. -->
</svg>